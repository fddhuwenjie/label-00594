services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: purchase-approval-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: purchase_approval
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - purchase-network

  # ASP.NET Core Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: purchase-approval-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=purchase_approval;Username=postgres;Password=postgres123
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - purchase-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: purchase-approval-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - purchase-network

volumes:
  postgres_data:

networks:
  purchase-network:
    driver: bridge
